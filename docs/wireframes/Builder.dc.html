<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HIDIT builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Michroma&display=swap">
<style>body{margin:0}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; padding: 60px 20px 32px; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; --surface: {{c.surface}}; --sec: {{c.sec}}; --line: {{c.line}}; --work: {{c.work}}; --rec: {{c.rec}}; --accent: {{c.accent}}; --onaccent: {{c.onaccent}}; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif">
<a href="Main.dc.html" aria-label="Back to workouts" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 16px; background: #8E8584; color: #FFFFFF; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</a>
<h1 style="margin: 0 0 16px; font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 22px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em">HIDIT builder</h1>
<div style="background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden">
<div style="display: flex; align-items: center; min-height: 64px; box-sizing: border-box; padding: 8px 16px">
<div style="flex-grow: 1; font-size: 17px; font-weight: 600">Start work</div>
<button aria-label="Decrease start work" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--sec); font-size: 22px; padding: 0">&minus;</button>
<div style="width: 64px; text-align: center; font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums">{{v.start}}</div>
<button aria-label="Increase start work" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--sec); font-size: 22px; padding: 0">+</button>
</div>
<div style="display: flex; align-items: center; min-height: 64px; box-sizing: border-box; padding: 8px 16px; border-top: 1px solid var(--line)">
<div style="flex-grow: 1; font-size: 17px; font-weight: 600">Steps</div>
<button aria-label="Decrease steps" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--sec); font-size: 22px; padding: 0">&minus;</button>
<div style="width: 64px; text-align: center; font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums">{{v.count}}</div>
<button aria-label="Increase steps" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--sec); font-size: 22px; padding: 0">+</button>
</div>
<div style="padding: 8px 16px 14px; border-top: 1px solid var(--line)">
<div style="display: flex; align-items: center; min-height: 48px">
<div style="flex-grow: 1; font-size: 17px; font-weight: 600">Step-down</div>
<button aria-label="Decrease step-down" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--sec); font-size: 22px; padding: 0">&minus;</button>
<div style="width: 64px; text-align: center; font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums">{{v.down}}</div>
<button aria-label="Increase step-down" style="width: 44px; height: 44px; border-radius: 16px; border: 1px solid var(--line); background: transparent; color: var(--sec); font-size: 22px; padding: 0">+</button>
</div>
<div style="display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 14px; margin-top: 4px">
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: var(--line); color: {{c.text}}; font-size: 15px; font-weight: 600">Seconds</button>
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: transparent; color: var(--sec); font-size: 15px">Percent</button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 64px; box-sizing: border-box; padding: 8px 16px; border-top: 1px solid var(--line)">
<div style="flex-grow: 1">
<div style="font-size: 17px; font-weight: 600">Recovery</div>
<div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec); margin-top: 2px">Work x 2/3, set automatically</div>
</div>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--sec)" aria-label="Read only"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
<div style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums; color: var(--rec)">{{v.rec}}</div>
</div>
</div>
<div style="margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px 12px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<div style="font-size: 15px; font-weight: 600">Preview</div>
<div style="font-size: 15px; color: var(--sec); font-variant-numeric: tabular-nums">Total {{v.total}}</div>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between; height: 84px; margin-top: 12px; padding: 0 4px">
<sc-for list="{{v.steps}}" as="s" hint-placeholder-count="5">
<div style="display: flex; align-items: flex-end; gap: 3px; height: 100%; padding-left: 6px; border-left: 1px dashed rgba(26,26,25,0.3)">
<div style="width: 12px; height: {{s.wh}}px; border-radius: 3px; background: var(--work)"></div>
<div style="width: 12px; height: {{s.rh}}px; border-radius: 3px; background: var(--rec)"></div>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px; padding: 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec)">
<sc-for list="{{v.steps}}" as="s" hint-placeholder-count="5">
<div style="width: 35px; text-align: center">{{s.n}}</div>
</sc-for>
</div>
<div style="display: flex; gap: 16px; margin-top: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec)">
<div style="display: flex; align-items: center; gap: 6px"><div style="width: 10px; height: 10px; border-radius: 3px; background: var(--work)"></div>Work</div>
<div style="display: flex; align-items: center; gap: 6px"><div style="width: 10px; height: 10px; border-radius: 3px; background: var(--rec)"></div>Recover</div>
</div>
</div>
<div style="flex-grow: 1"></div>
<button style="height: 72px; width: 100%; border: 0; border-radius: 36px; background: var(--accent); color: var(--onaccent); font-size: 20px; font-weight: 600">Start</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"edited":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const c = dark
      ? { bg: '#1A1A19', surface: '#2A2927', text: '#F5F4EE', sec: '#A8A59D', work: '#5CC49A', rec: '#7AA8E6', accent: '#D9805F', onaccent: '#1A1A19', line: 'rgba(245,244,238,0.14)' }
      : { bg: '#DBDAD8', surface: '#E7E6E3', text: '#1A1A19', sec: '#5E5B58', work: '#B93A26', rec: '#4A4746', accent: '#1A1A19', onaccent: '#FFFFFF', line: 'rgba(26,26,25,0.16)' };
    const edited = this.props.edited === true || this.props.edited === 'true';
    const scale = 84 / 180;
    const pairs = edited ? [[120, 80], [105, 70], [90, 60], [75, 50]] : [[180, 120], [150, 100], [120, 80], [90, 60], [60, 40]];
    const steps = pairs.map((p, i) => ({ n: i + 1, wh: Math.round(p[0] * scale), rh: Math.round(p[1] * scale) }));
    const v = edited
      ? { start: '2:00', count: '4', down: '15 s', rec: '1:20', total: '10:50', steps }
      : { start: '3:00', count: '5', down: '30 s', rec: '2:00', total: '16:40', steps };
    return { c, v };
  }
}
</script>
</body>
</html>
