<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Michroma&display=swap">
<style>body{margin:0}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.text}}; --surface: {{c.surface}}; --sec: {{c.sec}}; --line: {{c.line}}; --accent: {{c.accent}}; --onaccent: {{c.onaccent}}; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: {{c.scrim}}"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; box-sizing: border-box; padding: 12px 20px 28px; background: var(--bg, {{c.bg}}); border-top: 1px solid var(--line); border-radius: 28px 28px 0 0; display: flex; flex-direction: column">
<div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: var(--line)"></div>
<h1 style="margin: 16px 0 12px; font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 22px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em">Settings</h1>
<div style="background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden">
<div style="padding: 12px 16px">
<div style="font-size: 17px; font-weight: 600">Sound</div>
<div style="display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 14px; margin-top: 8px">
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: var(--line); color: {{c.text}}; font-size: 15px; font-weight: 600">On</button>
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: transparent; color: var(--sec); font-size: 15px">Off</button>
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: transparent; color: var(--sec); font-size: 15px">Voice only</button>
</div>
</div>
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<div style="display: flex; align-items: center; min-height: 56px; box-sizing: border-box; padding: 0 16px; border-top: 1px solid var(--line)">
<div style="flex-grow: 1; font-size: 17px">{{t.label}}</div>
<div style="width: 52px; height: 32px; border-radius: 16px; background: {{t.bg}}; position: relative; border: 1px solid var(--line)">
<div style="position: absolute; top: 3px; left: {{t.knob}}px; width: 24px; height: 24px; border-radius: 12px; background: {{t.knobBg}}"></div>
</div>
</div>
</sc-for>
<div style="padding: 12px 16px; border-top: 1px solid var(--line)">
<div style="font-size: 17px">Countdown length</div>
<div style="display: flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 14px; margin-top: 8px">
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: transparent; color: var(--sec); font-size: 15px">Off</button>
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: transparent; color: var(--sec); font-size: 15px">5 s</button>
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: var(--line); color: {{c.text}}; font-size: 15px; font-weight: 600">10 s</button>
<button style="flex: 1; height: 40px; border: 0; border-radius: 11px; background: transparent; color: var(--sec); font-size: 15px">15 s</button>
</div>
</div>
</div>
<div style="margin-top: 16px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec)">Test cues</div>
<div style="display: flex; gap: 8px; margin-top: 8px">
<button style="flex: 1; height: 48px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: {{c.text}}; font-size: 15px; font-weight: 500">Run</button>
<button style="flex: 1; height: 48px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: {{c.text}}; font-size: 15px; font-weight: 500">Recover</button>
<button style="flex: 1; height: 48px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: {{c.text}}; font-size: 15px; font-weight: 500">Finish</button>
</div>
<div style="flex-grow: 1"></div>
<button style="height: 72px; width: 100%; border: 0; border-radius: 36px; background: var(--accent); color: var(--onaccent); font-size: 20px; font-weight: 600">Done</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const c = dark
      ? { bg: '#1A1A19', surface: '#2A2927', text: '#F5F4EE', sec: '#A8A59D', work: '#5CC49A', accent: '#D9805F', onaccent: '#1A1A19', line: 'rgba(245,244,238,0.14)', scrim: 'rgba(0,0,0,0.35)' }
      : { bg: '#DBDAD8', surface: '#E7E6E3', text: '#1A1A19', sec: '#5E5B58', work: '#B93A26', accent: '#1A1A19', onaccent: '#FFFFFF', line: 'rgba(26,26,25,0.16)', scrim: 'rgba(26,26,25,0.25)' };
    const on = (label, isOn) => ({
      label,
      bg: isOn ? c.work : 'transparent',
      knob: isOn ? 24 : 3,
      knobBg: isOn ? c.bg : c.sec
    });
    return { c, toggles: [on('Haptics', true), on('Volume boost', false), on('Countdown ticks', true)] };
  }
}
</script>
</body>
</html>
