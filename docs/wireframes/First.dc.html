<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First launch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Michroma&display=swap">
<style>body{margin:0}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; isolation: isolate; position: relative; overflow: hidden; padding: 72px 20px 32px; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; --surface: {{c.surface}}; --sec: {{c.sec}}; --line: {{c.line}}; --work: {{c.work}}; --accent: {{c.accent}}; --onaccent: {{c.onaccent}}; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none" aria-hidden="true">
<div style="position: absolute; left: -210px; top: -120px; width: 380px; height: 380px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -150px; top: 90px; width: 400px; height: 400px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -60px; top: 420px; width: 560px; height: 560px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -170px; top: 560px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle at 45% 45%, #C4432B 0%, #D98A3B 58%, rgba(219,218,216,0) 74%); filter: blur(10px)"></div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center">
<div style="display: flex; align-items: flex-end; gap: 5px; height: 44px">
<div style="width: 7px; height: 44px; border-radius: 3px; background: var(--work)"></div>
<div style="width: 7px; height: 34px; border-radius: 3px; background: var(--work)"></div>
<div style="width: 7px; height: 24px; border-radius: 3px; background: var(--work)"></div>
<div style="width: 7px; height: 14px; border-radius: 3px; background: var(--work)"></div>
</div>
<h1 style="margin: 24px 0 0; font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 22px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em">Interval timer</h1>
<div style="margin-top: 8px; font-size: 17px; color: var(--sec)">HIDIT and fixed presets for VO2 max training.</div>
<div style="margin-top: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: flex; gap: 12px; align-items: flex-start">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--sec)" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
<div style="font-size: 17px; line-height: 1.4">Check with a doctor before high-intensity training</div>
</div>
</div>
<button style="height: 72px; width: 100%; border: 0; border-radius: 36px; background: var(--accent); color: var(--onaccent); font-size: 20px; font-weight: 600">Got it</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const c = dark
      ? { bg: '#1A1A19', surface: '#2A2927', text: '#F5F4EE', sec: '#A8A59D', work: '#5CC49A', accent: '#D9805F', onaccent: '#1A1A19', line: 'rgba(245,244,238,0.14)' }
      : { bg: '#DBDAD8', surface: '#E7E6E3', text: '#1A1A19', sec: '#5E5B58', work: '#B93A26', accent: '#1A1A19', onaccent: '#FFFFFF', line: 'rgba(26,26,25,0.16)' };
    return { c };
  }
}
</script>
</body>
</html>
