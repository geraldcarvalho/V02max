<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Get ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Michroma&display=swap">
<style>body{margin:0}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; isolation: isolate; position: relative; overflow: hidden; padding: 72px 20px 32px; display: flex; flex-direction: column; align-items: center; background: {{c.bg}}; color: {{c.text}}; --sec: {{c.sec}}; --line: {{c.line}}; --accent: {{c.accent}}; --onaccent: {{c.onaccent}}; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none" aria-hidden="true">
<div style="position: absolute; left: -210px; top: -120px; width: 380px; height: 380px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -150px; top: 90px; width: 400px; height: 400px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -60px; top: 420px; width: 560px; height: 560px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -170px; top: 560px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle at 45% 45%, #C4432B 0%, #D98A3B 58%, rgba(219,218,216,0) 74%); filter: blur(10px)"></div>
</div>
<div style="align-self: flex-start; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec)">HIDIT</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em">Get ready</div>
<div style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 140px; font-weight: 400; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 8px">10</div>
<div style="margin-top: 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec)">First: run hard 3:00</div>
</div>
<button style="height: 72px; width: 100%; border: 0; border-radius: 36px; background: var(--accent); color: var(--onaccent); font-size: 20px; font-weight: 600">Skip</button>
<button style="margin-top: 8px; height: 56px; width: 100%; border: 0; background: transparent; color: var(--sec); font-size: 17px; font-weight: 500">Cancel</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const c = dark
      ? { bg: '#1A1A19', text: '#F5F4EE', sec: '#A8A59D', accent: '#D9805F', onaccent: '#1A1A19', line: 'rgba(245,244,238,0.14)' }
      : { bg: '#DBDAD8', text: '#1A1A19', sec: '#5E5B58', accent: '#1A1A19', onaccent: '#FFFFFF', line: 'rgba(26,26,25,0.16)' };
    return { c };
  }
}
</script>
</body>
</html>
