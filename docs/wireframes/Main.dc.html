<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Michroma&display=swap">
<style>body{margin:0}button{font-family:inherit}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; isolation: isolate; position: relative; overflow: hidden; padding: 72px 20px 32px; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.text}}; --surface: {{c.surface}}; --sec: {{c.sec}}; --line: {{c.line}}; --work: {{c.work}}; --accent: {{c.accent}}; --onaccent: {{c.onaccent}}; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; pointer-events: none" aria-hidden="true">
<div style="position: absolute; left: -210px; top: -120px; width: 380px; height: 380px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -150px; top: 90px; width: 400px; height: 400px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -60px; top: 420px; width: 560px; height: 560px; border-radius: 50%; border: 1px solid rgba(26,26,25,0.16)"></div>
<div style="position: absolute; left: -170px; top: 560px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle at 45% 45%, #C4432B 0%, #D98A3B 58%, rgba(219,218,216,0) 74%); filter: blur(10px)"></div>
</div>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
<div style="font-size: 17px; font-weight: 300; line-height: 1.35; max-width: 220px">Hi, your next session is <span style="font-weight: 600">HIDIT</span>, five steps.</div>
<div style="text-align: right">
<div style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 15px; font-weight: 400; text-transform: uppercase">Monday</div>
<div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec)">Mon 28 Sep</div>
</div>
</div>
<button aria-label="Settings" style="margin-top: 20px; width: 48px; height: 48px; border-radius: 16px; border: 0; background: #8E8584; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
</button>
<div style="margin-top: 28px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 14px; min-height: 72px; box-sizing: border-box; padding: 12px 0; border-top: {{r.border}}">
<div style="width: 28px; height: 28px; flex-shrink: 0; display: flex; align-items: flex-end; justify-content: center; gap: 3px">
<sc-if value="{{r.glyph}}" hint-placeholder-val="{{ true }}">
<div style="width: 4px; height: 26px; border-radius: 2px; background: var(--work)"></div>
<div style="width: 4px; height: 20px; border-radius: 2px; background: var(--work)"></div>
<div style="width: 4px; height: 14px; border-radius: 2px; background: var(--work)"></div>
<div style="width: 4px; height: 8px; border-radius: 2px; background: var(--work)"></div>
</sc-if>
</div>
<div style="flex-grow: 1">
<div style="font-family: 'Michroma', 'Arial Black', sans-serif; font-size: 13px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.03em">{{r.name}}</div>
<div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec); margin-top: 2px">{{r.detail}}</div>
</div>
<sc-if value="{{r.selected}}" hint-placeholder-val="{{ true }}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Selected"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</sc-if>
<sc-if value="{{r.editable}}" hint-placeholder-val="{{ true }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--sec)"><path d="M9 5l7 7-7 7"/></svg>
</sc-if>
</div>
</sc-for>
</div>
<div style="margin-top: 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--sec)">HIDIT, 5 steps, about 17 minutes of intervals. Warm-up and cooldown not included.</div>
<div style="flex-grow: 1"></div>
<button style="height: 72px; width: 100%; border: 0; border-radius: 36px; background: var(--accent); color: var(--onaccent); font-size: 20px; font-weight: 600">Start</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.mode ?? 'light') === 'dark';
    const c = dark
      ? { bg: '#1A1A19', surface: '#2A2927', text: '#F5F4EE', sec: '#A8A59D', work: '#5CC49A', accent: '#D9805F', onaccent: '#1A1A19', line: 'rgba(245,244,238,0.14)' }
      : { bg: '#DBDAD8', surface: '#E7E6E3', text: '#1A1A19', sec: '#5E5B58', work: '#B93A26', accent: '#1A1A19', onaccent: '#FFFFFF', line: 'rgba(26,26,25,0.16)' };
    const hair = '1px dashed rgba(26,26,25,0.3)';
    const rows = [
      { name: 'HIDIT', detail: 'Decreasing intervals, 3:2 work to recovery', glyph: true, selected: true, editable: true, border: 'none' },
      { name: 'Norwegian 4x4', detail: '4 rounds, 4:00 work, 3:00 recover', glyph: false, selected: false, editable: false, border: hair },
      { name: '30/30', detail: '30 s work, 30 s recover', glyph: false, selected: false, editable: false, border: hair },
      { name: 'Tabata', detail: '8 rounds, 20 s work, 10 s recover', glyph: false, selected: false, editable: false, border: hair },
      { name: 'Custom', detail: 'Set your own work and recover', glyph: false, selected: false, editable: true, border: hair }
    ];
    return { c, rows };
  }
}
</script>
</body>
</html>
